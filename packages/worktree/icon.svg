<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="New Worktree">
  <!-- Original artwork: a branch fork ending in a new managed checkout. -->
  <defs>
    <linearGradient id="bw-worktree-tile" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07131F"/>
      <stop offset="0.55" stop-color="#10344B"/>
      <stop offset="1" stop-color="#127C86"/>
    </linearGradient>
    <radialGradient id="bw-worktree-glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#35D6E8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#35D6E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bw-worktree-sheen" x1="2" y1="2" x2="2" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bw-worktree-clip"><rect x="2" y="2" width="60" height="60" rx="15"/></clipPath>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bw-worktree-tile)"/>
  <g clip-path="url(#bw-worktree-clip)">
    <circle cx="46" cy="16" r="22" fill="url(#bw-worktree-glow)"/>
  </g>
  <g fill="none" stroke="#EAFDFF" stroke-width="3" stroke-linecap="round">
    <path d="M20 17V47"/>
    <path d="M20 34C28 34 37 30 37 22"/>
  </g>
  <circle cx="20" cy="17" r="4.5" fill="#EAFDFF"/>
  <circle cx="20" cy="47" r="4.5" fill="#EAFDFF"/>
  <circle cx="37" cy="22" r="4.5" fill="#67E8F9"/>
  <rect x="35" y="32" width="18" height="18" rx="5" fill="#67E8F9" fill-opacity="0.12" stroke="#67E8F9" stroke-width="2.75"/>
  <g stroke="#9CF7D0" stroke-width="2.75" stroke-linecap="round">
    <path d="M44 38V44"/>
    <path d="M41 41H47"/>
  </g>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bw-worktree-sheen)"/>
</svg>
