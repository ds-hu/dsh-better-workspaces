<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Workspace Git Status">
  <!-- Original artwork: one workspace status line, live and verified. -->
  <defs>
    <linearGradient id="bw-status-tile" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1226"/>
      <stop offset="0.55" stop-color="#122A5C"/>
      <stop offset="1" stop-color="#2F5BD8"/>
    </linearGradient>
    <radialGradient id="bw-status-glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#6EA8FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6EA8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bw-status-sheen" x1="2" y1="2" x2="2" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bw-status-clip"><rect x="2" y="2" width="60" height="60" rx="15"/></clipPath>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bw-status-tile)"/>
  <g clip-path="url(#bw-status-clip)">
    <circle cx="46" cy="48" r="24" fill="url(#bw-status-glow)"/>
  </g>
  <rect x="11" y="25" width="38" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.07" stroke="#E8EFFF" stroke-width="2.5"/>
  <path d="M15.5 33H22L25 27.5L29 38L32 33H36" fill="none" stroke="#B7F36B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="48" cy="22" r="7" fill="#B7F36B"/>
  <path d="M45 22L47.3 24.3L51 20.3" fill="none" stroke="#0A1226" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bw-status-sheen)"/>
</svg>
