# The @ds-hu/dsh-better-workspaces bundle patch: four independent feature rows.
#
# `dsh plugin --profile <name> add` maintains `dsh.profile.bundles` automatically
# (the reconcile step in the dsh CLI appends every dependency declaring
# `dsh.bundle`), so this file is the only wiring an installation needs. Users
# never hand-edit their profile's cordis.patch.yml for this plugin.
#
# Every row is its own Loader entry, so the Plugins page shows one switch per
# feature and switching one off leaves the others mounted:
#
#   bw-diff       right-sidebar 代码变更 page (diff view, action ladder, editor)
#   bw-worktree   composer 新建 worktree strip + right-sidebar 新建 worktree page
#   bw-status     workspace-title badge line + composer diff pill
#   bw-forge      composer GitHub control + right-sidebar Issue 与 PR page
#
# `@ds-hu/dsh-bw-core` is deliberately not a row: it is the shared library the
# four rows depend on (and the owner of the always-on read data plane). It
# declares neither `dsh.bundle` nor `dsh.client`, so the panel can never toggle
# it and no feature can accidentally unmount it.
#
# Parity rules, guarded by `test/package.mjs`:
#   - `name` is the package name, so the Loader resolves the row (and the code
#     it mounts) from the profile's node_modules;
#   - `id` is the `name` the host half exports, so the row and the plugin are
#     recognizably the same thing (and a user's disable/config override keeps
#     working across upgrades).
#
# Row config accepted by any feature row: `worktreesDir` (the managed worktree
# namespace, ADR 0017). Write it on exactly one row — `bw-worktree` is the
# natural place; two rows disagreeing is a mount error rather than a silent
# coin toss.
#
# The plugin publishes no services, so the rows sit loose in the host root realm.
- insert:
    - id: bw-diff
      name: '@ds-hu/dsh-bw-diff'

    - id: bw-worktree
      name: '@ds-hu/dsh-bw-worktree'

    - id: bw-status
      name: '@ds-hu/dsh-bw-status'

    - id: bw-forge
      name: '@ds-hu/dsh-bw-forge'
