<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Better Workspaces">
  <!-- Original artwork: four module panes on one shared workspace tile. -->
  <defs>
    <linearGradient id="bw-bundle-tile" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0A18"/>
      <stop offset="0.55" stop-color="#16132E"/>
      <stop offset="1" stop-color="#2A2358"/>
    </linearGradient>
    <radialGradient id="bw-bundle-violet" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#8E6BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8E6BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bw-bundle-cyan" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#35D6E8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#35D6E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bw-bundle-lime" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#B7F36B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#B7F36B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bw-bundle-rose" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#FF9BC8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF9BC8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bw-bundle-sheen" x1="2" y1="2" x2="2" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bw-bundle-clip"><rect x="2" y="2" width="60" height="60" rx="15"/></clipPath>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bw-bundle-tile)"/>
  <g clip-path="url(#bw-bundle-clip)">
    <circle cx="46" cy="14" r="18" fill="url(#bw-bundle-violet)"/>
    <circle cx="52" cy="50" r="16" fill="url(#bw-bundle-cyan)"/>
    <circle cx="14" cy="50" r="16" fill="url(#bw-bundle-lime)"/>
    <circle cx="14" cy="14" r="16" fill="url(#bw-bundle-rose)"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="1.5">
    <rect x="13" y="13" width="17" height="17" rx="5"/>
    <rect x="34" y="13" width="17" height="17" rx="5"/>
    <rect x="13" y="34" width="17" height="17" rx="5"/>
    <rect x="34" y="34" width="17" height="17" rx="5"/>
  </g>
  <!-- diff: compared lines -->
  <g stroke="#B9A6FF" stroke-width="2.2" stroke-linecap="round">
    <path d="M18.5 20H25"/>
    <path d="M18.5 25H23"/>
  </g>
  <!-- worktree: a branch forking off to a new checkout -->
  <g fill="none" stroke="#67E8F9" stroke-width="2.2" stroke-linecap="round">
    <path d="M39 25.5V16.5"/>
    <path d="M39 21.5C42.5 21.5 44.5 20 44.5 16.5"/>
  </g>
  <circle cx="44.5" cy="16.5" r="2.1" fill="#67E8F9"/>
  <!-- status: one badge line with a live dot -->
  <path d="M18.5 38.5H23" stroke="#8FD0FF" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="19" cy="42.5" r="2.4" fill="#B7F36B"/>
  <path d="M23.5 42.5H27" stroke="#B7F36B" stroke-width="2.2" stroke-linecap="round"/>
  <!-- forge: an issue linked into the draft -->
  <circle cx="38.5" cy="39.5" r="2.1" fill="#FF9BC8"/>
  <circle cx="45" cy="45.5" r="2.1" fill="#F4E9FF"/>
  <path d="M40.2 41L43.3 44" stroke="#FFD0E8" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bw-bundle-sheen)"/>
</svg>
