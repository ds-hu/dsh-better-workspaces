name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node }} quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  # The Ubuntu job above is the full gate. This one exists because the other
  # half of the implementation — the Windows path model (ADR 0013): canonical
  # paths instead of dirfds, stat dev/ino identity checks, CAS + rename saves —
  # is invisible to Linux, and the suite spent a long time never being run here.
  # The cases that need a POSIX shell, POSIX file names or /proc report
  # SKIP <label>: <reason> rather than passing; they are covered above.
  windows:
    name: Windows path model (Node 22)
    runs-on: windows-latest
    # The whole three-suite run takes about a minute of work on a hosted runner;
    # the budget is headroom for a slow image, not an expectation. A finished
    # suite can no longer sit on the event loop (the state hub's timers are
    # unref'd and test/run.js exits after flushing its report), which is what
    # once burned 44 minutes of a 45-minute timeout after 17 seconds of tests.
    timeout-minutes: 20
    steps:
      # Before checkout: the repository ships no .gitattributes, and the suites
      # compare exact bytes, so a CRLF checkout would fail hundreds of asserts.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:host -- --progress
      - run: npm run test:security
      - run: npm run test:mount
